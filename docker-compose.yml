services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    environment:
      # Tool-level allowlist: POST enabled at proxy, but remediation_tool.py
      # enforces the semantic allowlist (restart/pause/unpause only).
      # Raw exec, image build, network/create remain blocked by tool code.
      CONTAINERS: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375"
    networks:
      - phoenix-net

  checkout-service:
    # CHECKOUT_VERSION selects which pre-built artifact runs. It is a build arg,
    # so the version is baked into the image rather than passed in at run time --
    # restarting the container cannot change it. Rollback redeploys a different
    # value of this one variable against the image already built for it. The
    # rollback path does not build: it checks the tag exists locally first, so a
    # version that was never built fails loudly rather than pulling an artifact
    # nobody verified (see the proxy's denied IMAGES above).
    image: agentic/checkout-service:${CHECKOUT_VERSION:-v17}
    build:
      context: ./services/demo-checkout
      args:
        APP_VERSION: ${CHECKOUT_VERSION:-v17}
        REGRESSION_ENABLED: ${CHECKOUT_REGRESSION:-false}
    container_name: checkout-service
    environment:
      - CHAOS_ENABLED=true
    labels:
      # Read back from the running container by the observer. This is the
      # artifact identity that verification trusts, as opposed to the version
      # the process claims over HTTP.
      - app.version=${CHECKOUT_VERSION:-v17}
    ports:
      - "8001:8000"
    networks:
      - phoenix-net

  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    environment:
      - CHAOS_ENABLED=true
      # Read back from the running container's own /health response, not from
      # docker, which is what rollback_config verifies against and what the
      # rollback target resolver checks before acting -- see
      # phoenix/graph/config_rollback_target.py.
      - DB_POOL_SIZE=${AUTH_DB_POOL_SIZE:-10}
    ports:
      - "8002:8000"
    networks:
      - phoenix-net
    depends_on:
      - postgres
      - redis

  payment-service:
    build: ./services/payment-service
    container_name: payment-service
    environment:
      - CHAOS_ENABLED=true
      - DATABASE_URL=postgresql://payment_app:${PAYMENT_APP_PASSWORD}@postgres:5432/phoenix
    ports:
      - "8003:8000"
    networks:
      - phoenix-net
    depends_on:
      - postgres
      - redis

  worker-service:
    build: ./services/worker-service
    container_name: worker-service
    environment:
      - CHAOS_ENABLED=true
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - REDIS_URL=redis://redis:6379
    ports:
      - "8004:8000"
    networks:
      - phoenix-net
    depends_on:
      - rabbitmq
      - redis

  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    environment:
      - CHAOS_ENABLED=true
      - AUTH_URL=http://auth-service:8000
      - PAYMENT_URL=http://payment-service:8000
      - CHECKOUT_URL=http://checkout-service:8000
    ports:
      - "8005:8000"
    networks:
      - phoenix-net
    depends_on:
      - auth-service
      - payment-service
      - checkout-service

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - phoenix-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - phoenix-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - phoenix-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    ports:
      - "9091:9090"
    networks:
      - phoenix-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks:
      - phoenix-net

  loki:
    image: grafana/loki:3.1.1
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - phoenix-net

  promtail:
    image: grafana/promtail:3.1.1
    container_name: promtail
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - phoenix-net
    depends_on:
      - loki

  postgres:
    image: postgres:16.4
    container_name: postgres
    environment:
      POSTGRES_USER: phoenix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: phoenix
      PHOENIX_APP_PASSWORD: ${PHOENIX_APP_PASSWORD}
      PAYMENT_APP_PASSWORD: ${PAYMENT_APP_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./phoenix/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - phoenix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoenix -d phoenix"]
      interval: 5s
      timeout: 3s
      retries: 5

  phoenix-api:
    build: ./phoenix/api
    container_name: phoenix-api
    environment:
      DATABASE_URL: postgresql://phoenix_app:${PHOENIX_APP_PASSWORD}@postgres:5432/phoenix
    ports:
      - "5000:8000"
    networks:
      - phoenix-net
    depends_on:
      postgres:
        condition: service_healthy

networks:
  phoenix-net:
    driver: bridge

volumes:
  postgres-data:
