services:
  docker-socket-proxy:
    # Pinned by digest: the rule order inside this image decides what the proxy
    # lets through, and :latest can change it underneath us.
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: docker-socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The allowlist lives in this template rather than in environment flags.
      # The image's own template refuses every non-GET unless POST=1 before it
      # reaches the ALLOW_RESTARTS / ALLOW_PAUSE / ALLOW_UNPAUSE rules, and
      # POST=1 would open /containers/create and /containers/{id}/exec, which
      # with the socket mounted is host-root equivalent. The template allows GET
      # on /containers/{name}/json and POST on restart, pause and unpause only.
      - ./infra/docker-socket-proxy/haproxy.cfg.template:/usr/local/etc/haproxy/haproxy.cfg.template:ro
    ports:
      - "127.0.0.1:2375:2375"
    networks:
      - phoenix-net

  checkout-service:
    # CHECKOUT_VERSION selects which pre-built artifact runs. It is a build arg,
    # so the version is baked into the image rather than passed in at run time --
    # restarting the container cannot change it. Rollback redeploys a different
    # value of this one variable against the image already built for it. The
    # rollback path does not build: it checks the tag exists locally first, so a
    # version that was never built fails loudly rather than pulling an artifact
    # nobody verified (see the proxy's denied IMAGES above).
    image: agentic/checkout-service:${CHECKOUT_VERSION:-v17}
    build:
      context: ./services/demo-checkout
      args:
        APP_VERSION: ${CHECKOUT_VERSION:-v17}
        REGRESSION_ENABLED: ${CHECKOUT_REGRESSION:-false}
    container_name: checkout-service
    environment:
      - CHAOS_ENABLED=true
    labels:
      # Read back from the running container by the observer. This is the
      # artifact identity that verification trusts, as opposed to the version
      # the process claims over HTTP.
      - app.version=${CHECKOUT_VERSION:-v17}
    ports:
      - "8001:8000"
    networks:
      - phoenix-net

  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    environment:
      - CHAOS_ENABLED=true
      # Read back from the running container's own /health response, not from
      # docker, which is what rollback_config verifies against and what the
      # rollback target resolver checks before acting -- see
      # phoenix/graph/config_rollback_target.py.
      - DB_POOL_SIZE=${AUTH_DB_POOL_SIZE:-10}
    ports:
      - "8002:8000"
    networks:
      - phoenix-net
    depends_on:
      - postgres
      - redis

  payment-service:
    build: ./services/payment-service
    container_name: payment-service
    environment:
      - CHAOS_ENABLED=true
      - DATABASE_URL=postgresql://payment_app:${PAYMENT_APP_PASSWORD}@postgres:5432/phoenix
    ports:
      - "8003:8000"
    networks:
      - phoenix-net
    depends_on:
      - postgres
      - redis

  worker-service:
    build: ./services/worker-service
    container_name: worker-service
    environment:
      - CHAOS_ENABLED=true
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - REDIS_URL=redis://redis:6379
    ports:
      - "8004:8000"
    networks:
      - phoenix-net
    depends_on:
      - rabbitmq
      - redis

  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    environment:
      - CHAOS_ENABLED=true
      - AUTH_URL=http://auth-service:8000
      - PAYMENT_URL=http://payment-service:8000
      - CHECKOUT_URL=http://checkout-service:8000
    ports:
      - "8005:8000"
    networks:
      - phoenix-net
    depends_on:
      - auth-service
      - payment-service
      - checkout-service

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - phoenix-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - phoenix-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - phoenix-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    ports:
      - "9091:9090"
    networks:
      - phoenix-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks:
      - phoenix-net

  loki:
    image: grafana/loki:3.1.1
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - phoenix-net

  promtail:
    image: grafana/promtail:3.1.1
    container_name: promtail
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - phoenix-net
    depends_on:
      - loki

  postgres:
    image: postgres:16.4
    container_name: postgres
    # Standard production slow-statement logging: any statement over 200ms is
    # written to the server log, which promtail ships to Loki. This is what
    # lets an investigation corroborate a latency regression from the
    # database's own record of the slow statement, not just request timings.
    # 200ms rather than 500ms: the whole-table scan was first measured at about
    # 2s and now runs in under 500ms of server time on a faster host, which
    # logged nothing. A healthy indexed lookup takes about 10ms, so 200ms still
    # leaves a wide margin and never logs the normal path.
    command: ["postgres", "-c", "log_min_duration_statement=200"]
    environment:
      POSTGRES_USER: phoenix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: phoenix
      PHOENIX_APP_PASSWORD: ${PHOENIX_APP_PASSWORD}
      PAYMENT_APP_PASSWORD: ${PAYMENT_APP_PASSWORD}
      # Read by 010_create_slack_bridge_role.sh on a fresh volume. Empty makes the role
      # unable to log in, which is what a lab with no Slack bridge wants.
      SLACK_BRIDGE_PASSWORD: ${SLACK_BRIDGE_PASSWORD:-}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./phoenix/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - phoenix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoenix -d phoenix"]
      interval: 5s
      timeout: 3s
      retries: 5

  phoenix-api:
    build: ./phoenix/api
    container_name: phoenix-api
    environment:
      DATABASE_URL: postgresql://phoenix_app:${PHOENIX_APP_PASSWORD}@postgres:5432/phoenix
      # Read by phoenix/api/main.py. An unset token makes the approval endpoint
      # refuse every decision (503), so the empty default keeps it closed.
      PHOENIX_APPROVAL_TOKEN: ${PHOENIX_APPROVAL_TOKEN:-}
      PHOENIX_APPROVERS: ${PHOENIX_APPROVERS:-}
    ports:
      - "5000:8000"
    networks:
      - phoenix-net
    depends_on:
      postgres:
        condition: service_healthy

  # Posts held approvals to Slack and takes the Approve and Deny clicks. Opt-in: it only
  # starts with `docker compose --profile slack up -d slack-bridge`, so a checkout with no
  # Slack app configured never runs it. Socket Mode is outbound only, so it publishes no
  # port. It reads approvals through phoenix-api and writes decisions through it, and its
  # own database role can touch one table (see 010_create_slack_bridge_role.sh).
  slack-bridge:
    build:
      context: ./phoenix
      dockerfile: slack/Dockerfile
    container_name: slack-bridge
    profiles: ["slack"]
    # A bad setting makes it exit at once with a clear message. A few retries cover a
    # database that is still starting, and no more, so a typo does not loop forever.
    restart: on-failure:5
    environment:
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      PHOENIX_SLACK_CHANNEL: ${PHOENIX_SLACK_CHANNEL:-}
      PHOENIX_SLACK_APPROVERS: ${PHOENIX_SLACK_APPROVERS:-}
      PHOENIX_APPROVAL_TOKEN: ${PHOENIX_APPROVAL_TOKEN:-}
      PHOENIX_DASHBOARD_URL: ${PHOENIX_DASHBOARD_URL:-}
      PHOENIX_SLACK_POLL_SECONDS: ${PHOENIX_SLACK_POLL_SECONDS:-5}
      PHOENIX_API_URL: http://phoenix-api:8000
      # The password is not in the URL: a password with a character such as @ or / would
      # break it. libpq reads PGPASSWORD when the URL has none.
      DATABASE_URL: postgresql://slack_bridge@postgres:5432/phoenix
      PGPASSWORD: ${SLACK_BRIDGE_PASSWORD:-}
    networks:
      - phoenix-net
    depends_on:
      postgres:
        condition: service_healthy
      phoenix-api:
        condition: service_started

networks:
  phoenix-net:
    driver: bridge

volumes:
  postgres-data:
