groups:
  - name: checkout-service-alerts
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{job="checkout-service", status=~"5.."}[1m]))
          /
          sum(rate(http_requests_total{job="checkout-service"}[1m]))
          > 0.05
        for: 30s
        labels:
          severity: high
          service: checkout-service
        annotations:
          summary: "High error rate on checkout-service"
          description: "More than 5% of requests to checkout-service are returning 5xx over the last minute."

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket{job="checkout-service"}[1m])) by (le)
          ) > 1
        for: 30s
        labels:
          severity: high
          service: checkout-service
        annotations:
          summary: "High p95 latency on checkout-service"
          description: "p95 request latency for checkout-service has exceeded 1s for 30s+."

      - alert: ServiceDown
        expr: up{job="checkout-service"} == 0
        for: 15s
        labels:
          severity: critical
          service: checkout-service
        annotations:
          summary: "checkout-service is down"
          description: "Prometheus cannot scrape checkout-service — target has been down for 15s+."

  - name: multi-service-alerts
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (job) (rate(http_requests_total{job=~"auth-service|payment-service|worker-service|api-gateway", status=~"5.."}[1m]))
          /
          sum by (job) (rate(http_requests_total{job=~"auth-service|payment-service|worker-service|api-gateway"}[1m]))
          > 0.05
        for: 30s
        labels:
          severity: high
          service: "{{ $labels.job }}"
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "More than 5% of requests are returning 5xx over the last minute."

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (job, le) (rate(http_request_duration_seconds_bucket{job=~"auth-service|payment-service|worker-service|api-gateway"}[1m]))
          ) > 1
        for: 30s
        labels:
          severity: high
          service: "{{ $labels.job }}"
        annotations:
          summary: "High p95 latency on {{ $labels.job }}"
          description: "p95 request latency has exceeded 1s for 30s+."

      - alert: ServiceDown
        expr: up{job=~"auth-service|payment-service|worker-service|api-gateway"} == 0
        for: 15s
        labels:
          severity: critical
          service: "{{ $labels.job }}"
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus cannot scrape target — down for 15s+."

  - name: container-resource-alerts
    rules:
      - alert: WorkerServiceMemoryGrowth
        expr: |
          max(deriv(container_memory_working_set_bytes{name="worker-service", job="cadvisor"}[30m])) > 1024
        for: 10m
        labels:
          severity: high
          service: worker-service
        annotations:
          summary: "worker-service memory is growing steadily"
          description: "The worker-service container's memory working set has grown by more than 1 KiB per second averaged over 30m, sustained for 10m+."
