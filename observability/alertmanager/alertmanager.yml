global:
  resolve_timeout: 5m

route:
  receiver: phoenix-webhook
  group_by: ["alertname", "service"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 3h

receivers:
  - name: phoenix-webhook
    webhook_configs:
      # phoenix-api (phoenix/api/main.py) receives this and creates the incident row
      # the watcher investigates. If it is down, Alertmanager retries delivery and
      # logs the failure.
      - url: "http://phoenix-api:8000/webhooks/alertmanager"
        send_resolved: true
